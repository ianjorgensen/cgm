<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="data:,">
<title>Ripple</title>
<style>
  body {
    font: 12px system-ui, sans-serif;
    margin: 0;
    padding: 20px;
  }
  .wrap {
    max-width: 800px;
    margin: 0 auto;
    padding: 0 20px;
  }
  #viz {
    width: 725px;
    margin: 0 32px 20px;
  }
  .row {
    display: flex;
    gap: 20px;
    align-items: flex-start;
    margin-bottom: 10px;
  }
  .row > div {
    flex: 1 1 0;
    min-width: 0;
  }
  #agp, #strips {
    margin-top: 10px;
  }
  /* Strips adapts to container */
  #strips {
    width: 688px;
    margin-top: 20px;
    margin-left: 51px;
  }
  #tirdetailed {
    padding-left: 11px;
  }
  #summary {
    padding-right: 45px;
  }
  #controlBar {
    padding: 0;
  }

  /* Shortcuts modal */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.25);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 9999;
  }
  .cgm-dark .modal-overlay {
    background: rgba(255,255,255,0.25);
  }
  .modal-overlay.show {
    display: flex;
  }
  .modal {
    background: var(--cgm-bg, #fff);
    color: var(--cgm-text, #111);
    width: min(720px, 92vw);
    max-height: 80vh;
    overflow: auto;
    box-shadow: 0 8px 24px rgba(0,0,0,0.18);
    border: 1px solid var(--cgm-border, #eee);
  }
  .modal header {
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .modal header h3 {
    margin: 0;
    font-size: 12px;
  }
  .modal .content {
    padding: 12px 16px;
  }
  .kbd {
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    font-size: 12px;
    background: var(--cgm-target-band-bg, #f3f3f3);
    border: 1px solid var(--cgm-border, #e1e1e1);
    padding: 2px 6px;
    border-radius: 6px;
  }
  .shortcuts-grid {
    display: grid;
    grid-template-columns: 1fr 2fr;
    gap: 10px 16px;
    align-items: center;
  }
  .btn {
    padding: 6px 10px;
    border-radius: 8px;
    border: 1px solid var(--cgm-border, #ddd);
    background: var(--cgm-bg, #fff);
    color: var(--cgm-text, #111);
    cursor: pointer;
  }
  .btn:hover {
    background: rgba(0,0,0,0.03);
  }
  .modal header .icon-btn {
    background: transparent !important;
    border: 0;
    font-size: 18px;
    line-height: 1;
    padding: 2px 6px;
    color: var(--cgm-text, #111);
    opacity: 0.7;
  }
  .modal header .icon-btn:hover {
    opacity: 1;
  }
  .kbd-fab {
    position: fixed;
    right: 16px;
    bottom: 0;
    background: transparent;
    border: 0;
    box-shadow: none;
    padding: 0;
    cursor: pointer;
    z-index: 10000;
    opacity: 0.7;
    color: #555;
    font-size: 42px;
    line-height: 1;
  }
  .kbd-fab:hover {
    opacity: 1;
  }
  .cgm-dark .kbd-fab {
    color: #eee;
  }

  /* Theming palettes */
  .cgm-theme {
    background: white;
    --cgm-font: Inter, system-ui, sans-serif;
    --cgm-bg: #ffffff; --cgm-border: #e5e5e5; --cgm-grid: #eeeeee;
    --cgm-text: #111111; --cgm-muted: #666666;
    --cgm-selection-fill: rgba(0,0,0,0.10); --cgm-selection-stroke: #111111;
    --cgm-very-low: #e57373; --cgm-low: #ff9e80; --cgm-in-range: #86c89d;
    --cgm-high: #ffcc80; --cgm-very-high: #ff8a65;
    --cgm-low-strong: #d73027; --cgm-very-high-strong: #f46d43; --cgm-threshold: #2e7d32;
    --cgm-target-band-bg: #efefef; --cgm-context: #c7c7c7; --cgm-arrow: gray;
    --cgm-outside-light: #ededed; --cgm-outside-mid: #c4c4c4; --cgm-outside-dark: #b5b5b5;
    /* AGP pill text color follows background so it's dark in dark mode, white in light */
    --cgm-pill-text: var(--cgm-bg);
  }
  .cgm-theme.cgm-dark {
    background: #282828;
    --cgm-bg: #282828; --cgm-border: #3a3a3a; --cgm-grid: #ffffff;
    --cgm-text: #ffffff; --cgm-muted: #ffffff; --cgm-axis-color: #ffffff; --cgm-title: #ffffff;
    --cgm-selection-fill: rgba(255,255,255,0.07); --cgm-selection-stroke: #e6e6e6;
    --cgm-very-low: #ff7a7a; --cgm-low: #ffb199; --cgm-in-range: #7fd3a3;
    --cgm-high: #ffd591; --cgm-very-high: #ffa07a;
    --cgm-low-strong: #ff5a4d; --cgm-very-high-strong: #ff7a4d; --cgm-threshold: #79c28a;
    --cgm-target-band-bg: #333333; --cgm-context: #cfcfcf; --cgm-arrow: #f0f0f0;
    --cgm-outside-light: #3a3a3a; --cgm-outside-mid: #4a4a4a; --cgm-outside-dark: #5a5a5a;
  }
</style>

<body id="themeRoot" class="cgm-theme">
  <div class="wrap">
    <div id="viz"></div>
    <div class="row" id="rowST">
      <div id="tirdetailed"></div>
      <div id="summary"></div>
    </div>
    <div id="agp"></div>
    <div id="strips"></div>
  </div>
  <button id="helpFab" class="kbd-fab" title="Keyboard Shortcuts">⌨</button>
</body>

<link rel="stylesheet" href="../dist/lib/style.css" />
<script src="../dist/lib/cgm-tir.umd.js"></script>
<script type="module">
  import { lastNDaysRange } from './utils/dateRange.js'
  import { initShortcuts } from './utils/shortcuts.js'
  import { mountHelp } from './utils/helpModal.js'
  // Initialize theme from localStorage before rendering widgets
  try {
    const root = document.getElementById('themeRoot')
    const saved = localStorage.getItem('cgm-theme')
    if (saved === 'dark' || saved === 'light') {
      root.classList.toggle('cgm-dark', saved === 'dark')
    }
  } catch {}
  fetch('../../cgm-data/cgm_data.json').then(r=>r.json()).then(data => {
    let preset = 'general'

    const calendar = window.createTirCalendarLine('viz', data, { initialRange: lastNDaysRange(data, 14), preset: preset, canvasVisible: true, monthLabels: true, dataVisible: true, selectionStroke: 'none', selectionFill: 'rgba(0,0,0,0.12)' })
    // Summary stays in sync with calendar selection
    const summary = window.createCgmSummary('summary', data, { source: calendar, preset: preset })
    
    // When the Summary preset control changes, propagate to all widgets
    summary.on('presetchange', ({ preset: p })=>{
      try { calendar.setPreset(p) } catch {}
      try { summary.setPreset(p) } catch {}
      try { tirdetailed.setPreset(p) } catch {}
      try { strips.setPreset(p) } catch {}
      try { agp.setPreset(p) } catch {}
    })

    const tirdetailed = window.createCgmTirDetailed('tirdetailed', data, { source: calendar, preset: preset, showSeparators: false })
    const strips  = window.createCgmStrips('strips', data, { source: calendar, preset: preset, colorWholeWeek: false  })
    const agp     = window.createCgmAgp('agp', data, { source: calendar, preset: preset })

    // Help modal + keyboard shortcuts
    const help = mountHelp(document.body, {
      shortcuts: [
        { keys:'1–6', desc:'Quick spans (1d…90d)' },
        { keys:'←/→', desc:'Move selection by 1 day' },
        { keys:'Shift+←/→', desc:'Jump by current span' },
        { keys:'↑/↓ or Wheel', desc:'Pan timeline' },
        { keys:'G', desc:'Toggle goals/time in TIR Detailed' },
        { keys:'T', desc:'Targets: Tight ↔ General' },
        { keys:'P', desc:'Targets: Pregnancy ↔ General' },
        { keys:'D', desc:'Toggle theme (Light/Dark)' },
        { keys:'H', desc:'Show this help' }
      ]
    })
    const kb = initShortcuts({
      actions: {
        g: ()=>{ window.__showTime = !window.__showTime; try{ tirdetailed.setShowTime(window.__showTime) }catch{}; return true },
        t: ()=>{ try{ const next = (preset==='tight' ? 'general' : 'tight'); preset = next; calendar.setPreset(next); summary.setPreset(next); tirdetailed.setPreset(next); strips.setPreset(next); agp.setPreset(next); }catch{}; return true },
        p: ()=>{ try{ const next = (preset==='pregnancy' ? 'general' : 'pregnancy'); preset = next; calendar.setPreset(next); summary.setPreset(next); tirdetailed.setPreset(next); strips.setPreset(next); agp.setPreset(next); }catch{}; return true },
        d: (()=>{ const root=document.getElementById('themeRoot'); let dark = root.classList.contains('cgm-dark'); return ()=>{ dark=!dark; root.classList.toggle('cgm-dark', dark); try{ localStorage.setItem('cgm-theme', dark? 'dark':'light') }catch{}; try{ window.dispatchEvent(new Event('resize')) }catch{}; return true } })(),
        h: ()=>{ help.toggle(); return true }
      }
    })
    // FAB click opens help
    try { document.getElementById('helpFab')?.addEventListener('click', ()=>help.toggle()) } catch {}
  })
</script>
