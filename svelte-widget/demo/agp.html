<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AGP Widget Demo</title>
<style> body { font: 12px system-ui, sans-serif; margin: 16px; } #agp { max-width: 1100px; margin: 0 auto; } </style>

<div id="agp"></div>

<link rel="stylesheet" href="../dist/lib/style.css" />
<script src="../dist/lib/cgm-tir.umd.js"></script>
<script type="module">
  import { lastNDaysRange } from './utils/dateRange.js'
  fetch('../../cgm-data/cgm_data.json').then(r=>r.json()).then(data => {
    const { start: startDay, end: endDay } = lastNDaysRange(data, 14)
    const api = window.createCgmAgp('agp', data, { initialRange: { start: startDay, end: endDay }, preset: 'general' })
    // Optional: keyboard shortcuts to toggle tight/pregnancy vs general
    window.addEventListener('keydown', (e)=>{
      const tag = (e.target && e.target.tagName) ? e.target.tagName.toLowerCase() : ''
      if (['input','textarea','select'].includes(tag)) return
      if (e.key.toLowerCase()==='t'){
        const cur = (window.__preset || 'general')
        const nxt = (cur === 'tight') ? 'general' : 'tight'
        window.__preset = nxt; api.setPreset(nxt); e.preventDefault()
      }
      if (e.key.toLowerCase()==='p'){
        const cur = (window.__preset || 'general')
        const nxt = (cur === 'pregnancy') ? 'general' : 'pregnancy'
        window.__preset = nxt; api.setPreset(nxt); e.preventDefault()
      }
    })
  })
</script>
