<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Summary Widget Demo</title>
<style> body { font: 12px system-ui, sans-serif; margin: 16px; } #summary { max-width: 600px; margin: 0 auto; } </style>

<div id="summary"></div>
<div id="controls" style="max-width:600px;margin:8px auto 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
  <button id="shrink" style="padding:6px 10px;">shrink</button>
  <button id="grow" style="padding:6px 10px;">grow</button>
  <button id="btn14" style="padding:6px 10px;">Last 14 days</button>
  <button id="btn90" style="padding:6px 10px;">Last 90 days</button>
  <span style="margin-left:auto;color:#999;">Loads window ending at most recent day</span>
</div>
<div id="presetControls" style="max-width:600px;margin:8px auto 0;display:flex;gap:8px;align-items:center;">
  <span style="color:#555">Set target preset (external API):</span>
  <button id="pGeneral" style="padding:6px 10px;">General</button>
  <button id="pTight" style="padding:6px 10px;">Tight</button>
  <button id="pPreg" style="padding:6px 10px;">Pregnancy</button>
  <span id="presetLabel" style="margin-left:auto;color:#666"></span>
  
</div>

<link rel="stylesheet" href="../dist/lib/style.css" />
<script src="../dist/lib/cgm-tir.umd.js"></script>
<script type="module">
  import { lastNDaysRange, DAY } from './utils/dateRange.js'
  // Minimal demo: Summary only, using last 14 days from the dataset
  fetch('../../cgm-data/cgm_data.json').then(r=>r.json()).then(data => {
    const PRESETS = { general:'General', tight:'Tight', pregnancy:'Pregnancy' }
    let { start: startDay, end: endDay } = lastNDaysRange(data, 14)

    const summary = window.createCgmSummary('summary', data, { initialRange: { start: startDay, end: endDay }, preset: 'general' })
    // Log preset changes from the Summary widget's target selector
    summary.on('presetchange', ({ preset })=>{
      try { console.log(preset) } catch {}
    })

    const shrink = () => {
      // shrink by 1 day (min 1 day), keep end fixed
      if (startDay + DAY <= endDay) {
        startDay = startDay + DAY
        summary.setRange({ start: startDay, end: endDay })
      }
    }
    grow = () => {
      // grow by 1 day to the left, keep end fixed
      const next = Math.max(t0, startDay - DAY)
      if (next !== startDay) {
        startDay = next

        summary.setRange({ start: startDay, end: endDay })
      }
    }

    function loadLast(days){
      startDay = Math.max(t0, endDay - days*DAY + 1)
      summary.setRange({ start: startDay, end: endDay })
    }

    document.getElementById('btn14').onclick = () => loadLast(14)
    document.getElementById('btn90').onclick = () => loadLast(90)

    document.getElementById('shrink').onclick = () => shrink()
    document.getElementById('grow').onclick = () => grow()

    // Demonstrate external preset control via Summary API
    const label = document.getElementById('presetLabel')
    function setLabel(p){ label.textContent = `Preset: ${PRESETS[p] || p}` }
    document.getElementById('pGeneral').onclick = ()=>{ summary.setPreset('general'); setLabel('general') }
    document.getElementById('pTight').onclick   = ()=>{ summary.setPreset('tight');   setLabel('tight') }
    document.getElementById('pPreg').onclick    = ()=>{ summary.setPreset('pregnancy'); setLabel('pregnancy') }

    // Also log when the Summary’s internal buttons change the preset
    summary.on('presetchange', ({ preset })=>{
      console.log('[Summary] preset changed:', preset, '-', PRESETS[preset] || preset)
      setLabel(preset)
    })
    setLabel('general')
  })
</script>
