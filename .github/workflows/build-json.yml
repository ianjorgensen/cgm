name: Build CGM JSON

on:
  push:
    branches: [ "**" ]
    paths:
      - 'cgm-data/cgm_data.js'
      - 'scripts/cgm_to_json.js'

permissions:
  contents: write

jobs:
  build-json:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate cgm_data.json
        run: node scripts/cgm_to_json.js

      - name: Commit JSON if changed (only this file)
        run: |
          if ! git diff --quiet -- cgm-data/cgm_data.json; then
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add -- cgm-data/cgm_data.json
            git commit -m "chore: auto-generate cgm_data.json from cgm_data.js" -- cgm-data/cgm_data.json
            git push
          else
            echo "No changes to cgm-data/cgm_data.json."
          fi
