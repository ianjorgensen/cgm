<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fabric Flow</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .header {
            text-align: center;
            padding: 60px 20px 40px;
            color: white;
        }

        .header h1 {
            font-size: 4rem;
            font-weight: 700;
            margin-bottom: 10px;
            text-shadow: 0 10px 30px rgba(0,0,0,0.3);
            letter-spacing: -0.02em;
        }

        .header p {
            font-size: 1.2rem;
            opacity: 0.9;
            font-weight: 300;
        }

        .gallery-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px 80px;
        }

        .fabric-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 30px;
            margin-bottom: 60px;
        }

        .fabric-card {
            position: relative;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            height: 450px;
            perspective: 1000px;
        }

        .fabric-card:hover {
            transform: translateY(-20px) scale(1.05);
            box-shadow: 0 40px 80px rgba(0,0,0,0.25);
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }

        .fabric-card:hover .card-inner {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 20px;
            overflow: hidden;
        }

        .card-back {
            transform: rotateY(180deg);
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .fabric-image {
            width: 100%;
            height: 75%;
            background-size: cover;
            background-position: center;
            position: relative;
            overflow: hidden;
        }

        .fabric-image::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(180deg, transparent 0%, rgba(0,0,0,0.7) 100%);
            z-index: 1;
        }

        .fabric-info {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0,0,0,0.9);
            color: white;
            padding: 20px;
            z-index: 2;
            backdrop-filter: blur(10px);
        }

        .fabric-name {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .fabric-type {
            font-size: 1rem;
            opacity: 0.9;
            margin-bottom: 10px;
        }

        .fabric-price {
            background: rgba(255, 255, 255, 0.25);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            display: inline-block;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(10px);
        }

        .card-back h3 {
            font-size: 1.8rem;
            margin-bottom: 20px;
            text-align: center;
        }

        .description {
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 20px;
            opacity: 0.95;
        }

        .specifications {
            background: rgba(255,255,255,0.1);
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        .spec-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }

        .spec-item:last-child {
            margin-bottom: 0;
        }

        .care-instructions {
            font-size: 0.85rem;
            opacity: 0.8;
            text-align: center;
            font-style: italic;
        }

        .navigation {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 40px;
        }

        .nav-btn {
            padding: 12px 30px;
            background: rgba(255,255,255,0.2);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.3);
        }

        .nav-btn:hover, .nav-btn.active {
            background: rgba(255,255,255,0.9);
            color: #333;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        .page-indicators {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 40px;
        }

        .indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: rgba(255,255,255,0.4);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .indicator.active {
            background: white;
            transform: scale(1.3);
            box-shadow: 0 0 20px rgba(255,255,255,0.5);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(40px) rotateX(20deg);
            }
            to {
                opacity: 1;
                transform: translateY(0) rotateX(0);
            }
        }

        .fabric-card {
            animation: fadeInUp 0.8s ease forwards;
            opacity: 0;
        }

        .fabric-card:nth-child(1) { animation-delay: 0.1s; }
        .fabric-card:nth-child(2) { animation-delay: 0.2s; }
        .fabric-card:nth-child(3) { animation-delay: 0.3s; }
        .fabric-card:nth-child(4) { animation-delay: 0.4s; }
        .fabric-card:nth-child(5) { animation-delay: 0.5s; }
        .fabric-card:nth-child(6) { animation-delay: 0.6s; }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2.5rem;
            }
            
            .fabric-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }
            
            .fabric-card {
                height: 350px;
            }
            
            .card-back {
                padding: 20px;
            }
            
            .navigation {
                flex-wrap: wrap;
                gap: 10px;
            }
            
            .nav-btn {
                padding: 10px 20px;
                font-size: 0.9rem;
            }

            .fabric-card:hover .card-inner {
                transform: none;
            }

            .fabric-card:hover .card-back {
                opacity: 0.95;
                transform: translateY(0);
            }
        }

        .loading {
            opacity: 0.5;
            pointer-events: none;
        }

        .hover-hint {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(255,255,255,0.9);
            color: #333;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 0.75rem;
            font-weight: 500;
            z-index: 3;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Fabric Flow</h1>
        <p>Discover premium fabrics with seamless elegance</p>
    </div>

    <div class="gallery-container">
        <div class="navigation">
            <button class="nav-btn active" data-category="all">All Fabrics</button>
            <button class="nav-btn" data-category="silk">Silk</button>
            <button class="nav-btn" data-category="velvet">Velvet</button>
            <button class="nav-btn" data-category="linen">Linen</button>
            <button class="nav-btn" data-category="cotton">Cotton</button>
            <button class="nav-btn" data-category="lace">Lace</button>
        </div>

        <div class="fabric-grid" id="fabricGrid">
            <!-- Cards will be generated by JavaScript -->
        </div>

        <div class="page-indicators">
            <div class="indicator active" data-page="0"></div>
            <div class="indicator" data-page="1"></div>
            <div class="indicator" data-page="2"></div>
        </div>
    </div>

    <script>
        const fabrics = [
            {
                name: "Royal Velvet",
                type: "Crushed Velvet",
                price: "€85/m",
                category: "velvet",
                image: "https://images.unsplash.com/photo-1586790170083-2f9ceadc732d?w=800&h=600&fit=crop",
                description: "Luxurious crushed velvet with a rich, deep pile that catches light beautifully. Perfect for upholstery, drapery, and high-end fashion applications.",
                weight: "450gsm",
                width: "140cm",
                composition: "100% Cotton Velvet",
                care: "Dry clean only • Steam to refresh"
            },
            {
                name: "Provence Linen",
                type: "European Linen",
                price: "€42/m",
                category: "linen",
                image: "https://images.unsplash.com/photo-1544441892-794166f1e3be?w=800&h=600&fit=crop",
                description: "Classic European linen with natural texture and breathability. Softens beautifully with each wash, making it ideal for home textiles and casual wear.",
                weight: "180gsm",
                width: "150cm",
                composition: "100% European Linen",
                care: "Machine wash cold • Tumble dry low"
            },
            {
                name: "Boucle Texture",
                type: "Wool Boucle",
                price: "€75/m",
                category: "cotton",
                image: "https://images.unsplash.com/photo-1558618666-fcd25c85cd64?w=800&h=600&fit=crop",
                description: "Textured boucle fabric with distinctive looped yarns creating depth and visual interest. Excellent for modern upholstery and statement fashion pieces.",
                weight: "320gsm",
                width: "130cm",
                composition: "60% Wool, 40% Cotton",
                care: "Professional clean recommended"
            },
            {
                name: "Sunset Cotton",
                type: "Organic Cotton",
                price: "€28/m",
                category: "cotton",
                image: "https://images.unsplash.com/photo-1566479179817-97c4abdc42b4?w=800&h=600&fit=crop",
                description: "Soft, sustainable organic cotton with vibrant color retention. Versatile fabric perfect for clothing, quilting, and craft projects.",
                weight: "220gsm",
                width: "145cm",
                composition: "100% Organic Cotton",
                care: "Machine wash warm • Iron medium heat"
            },
            {
                name: "Pearl Silk",
                type: "Mulberry Silk",
                price: "€95/m",
                category: "silk",
                image: "https://images.unsplash.com/photo-1594736797933-d0401ba2fe65?w=800&h=600&fit=crop",
                description: "Premium mulberry silk with lustrous sheen and fluid drape. Naturally hypoallergenic and temperature regulating, perfect for luxury garments.",
                weight: "120gsm",
                width: "140cm",
                composition: "100% Mulberry Silk",
                care: "Dry clean or gentle hand wash"
            },
            {
                name: "Vintage Lace",
                type: "French Lace",
                price: "€120/m",
                category: "lace",
                image: "https://images.unsplash.com/photo-1578662996442-48f60103fc96?w=800&h=600&fit=crop",
                description: "Intricate French lace with delicate floral motifs. Hand-finished edges and exceptional detail work make this perfect for bridal wear and special occasions.",
                weight: "85gsm",
                width: "120cm",
                composition: "90% Cotton, 10% Polyester",
                care: "Hand wash cold • Lay flat to dry"
            },
            {
                name: "Midnight Velvet",
                type: "Cut Velvet",
                price: "€72/m",
                category: "velvet",
                image: "https://images.unsplash.com/photo-1604719312566-878b4c7ede21?w=800&h=600&fit=crop",
                description: "Deep, rich cut velvet with sophisticated pile direction creating subtle pattern variations. Ideal for evening wear and luxury home furnishings.",
                weight: "380gsm",
                width: "150cm",
                composition: "82% Cotton, 18% Viscose",
                care: "Dry clean only • Store hanging"
            },
            {
                name: "Ocean Silk",
                type: "Habotai Silk",
                price: "€88/m",
                category: "silk",
                image: "https://images.unsplash.com/photo-1518837695005-2083093ee35b?w=800&h=600&fit=crop",
                description: "Lightweight habotai silk with smooth texture and natural sheen. Perfect for linings, scarves, and flowing garments that require elegant drape.",
                weight: "95gsm",
                width: "135cm",
                composition: "100% Habotai Silk",
                care: "Dry clean preferred • Iron low heat"
            },
            {
                name: "Natural Flax",
                type: "Raw Linen",
                price: "€38/m",
                category: "linen",
                image: "https://images.unsplash.com/photo-1560967523-6d5b041a48e8?w=800&h=600&fit=crop",
                description: "Undyed raw linen with natural variations and rustic charm. Becomes softer and more beautiful with age, perfect for sustainable fashion and home decor.",
                weight: "200gsm",
                width: "155cm",
                composition: "100% Linen Flax",
                care: "Machine wash cold • Air dry preferred"
            },
            {
                name: "Rose Lace",
                type: "Chantilly Lace",
                price: "€145/m",
                category: "lace",
                image: "https://images.unsplash.com/photo-1594222433842-19a9a90e8ba7?w=800&h=600&fit=crop",
                description: "Exquisite Chantilly lace featuring delicate rose patterns and scalloped edges. Traditional craftsmanship meets modern elegance in this timeless design.",
                weight: "65gsm",
                width: "110cm",
                composition: "100% Nylon Lace",
                care: "Hand wash delicate • No bleach"
            },
            {
                name: "Forest Cotton",
                type: "Canvas Cotton",
                price: "€32/m",
                category: "cotton",
                image: "https://images.unsplash.com/photo-1586790170083-2f9ceadc732d?w=800&h=600&fit=crop",
                description: "Heavy-duty canvas cotton with tight weave and durability. Excellent for bags, outdoor items, and projects requiring strength and longevity.",
                weight: "280gsm",
                width: "160cm",
                composition: "100% Cotton Canvas",
                care: "Machine wash warm • Tumble dry medium"
            },
            {
                name: "Champagne Silk",
                type: "Dupioni Silk",
                price: "€110/m",
                category: "silk",
                image: "https://images.unsplash.com/photo-1615797440403-c7c80d98c4c5?w=800&h=600&fit=crop",
                description: "Textured dupioni silk with distinctive slubs and natural irregularities. Creates beautiful garments with structure and sophisticated sheen.",
                weight: "140gsm",
                width: "110cm",
                composition: "100% Dupioni Silk",
                care: "Dry clean only • Avoid water spots"
            }
        ];

        let currentPage = 0;
        let currentCategory = 'all';
        const itemsPerPage = 6;

        function createFabricCard(fabric, index) {
            return `
                <div class="fabric-card" style="animation-delay: ${index * 0.1}s">
                    <div class="card-inner">
                        <div class="card-front">
                            <div class="hover-hint">Hover for details</div>
                            <div class="fabric-image" style="background-image: url('${fabric.image}')">
                                <div class="fabric-info">
                                    <div class="fabric-name">${fabric.name}</div>
                                    <div class="fabric-type">${fabric.type}</div>
                                    <div class="fabric-price">${fabric.price}</div>
                                </div>
                            </div>
                        </div>
                        <div class="card-back">
                            <h3>${fabric.name}</h3>
                            <div class="description">${fabric.description}</div>
                            <div class="specifications">
                                <div class="spec-item">
                                    <span>Weight:</span>
                                    <span>${fabric.weight}</span>
                                </div>
                                <div class="spec-item">
                                    <span>Width:</span>
                                    <span>${fabric.width}</span>
                                </div>
                                <div class="spec-item">
                                    <span>Composition:</span>
                                    <span>${fabric.composition}</span>
                                </div>
                                <div class="spec-item">
                                    <span>Price:</span>
                                    <span>${fabric.price}</span>
                                </div>
                            </div>
                            <div class="care-instructions">${fabric.care}</div>
                        </div>
                    </div>
                </div>
            `;
        }

        function filterFabrics() {
            if (currentCategory === 'all') {
                return fabrics;
            }
            return fabrics.filter(fabric => fabric.category === currentCategory);
        }

        function renderFabrics() {
            const grid = document.getElementById('fabricGrid');
            const filteredFabrics = filterFabrics();
            const startIndex = currentPage * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;
            const currentFabrics = filteredFabrics.slice(startIndex, endIndex);

            grid.classList.add('loading');
            
            setTimeout(() => {
                grid.innerHTML = currentFabrics.map((fabric, index) => 
                    createFabricCard(fabric, index)
                ).join('');
                grid.classList.remove('loading');
            }, 200);

            updateIndicators();
        }

        function updateIndicators() {
            const indicators = document.querySelectorAll('.indicator');
            const filteredFabrics = filterFabrics();
            const totalPages = Math.ceil(filteredFabrics.length / itemsPerPage);

            indicators.forEach((indicator, index) => {
                indicator.style.display = index < totalPages ? 'block' : 'none';
                indicator.classList.toggle('active', index === currentPage);
            });
        }

        // Navigation event listeners
        document.querySelectorAll('.nav-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                
                currentCategory = e.target.dataset.category;
                currentPage = 0;
                renderFabrics();
            });
        });

        // Page indicator event listeners
        document.querySelectorAll('.indicator').forEach(indicator => {
            indicator.addEventListener('click', (e) => {
                currentPage = parseInt(e.target.dataset.page);
                renderFabrics();
            });
        });

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            const filteredFabrics = filterFabrics();
            const totalPages = Math.ceil(filteredFabrics.length / itemsPerPage);
            
            if (e.key === 'ArrowLeft' && currentPage > 0) {
                currentPage--;
                renderFabrics();
            } else if (e.key === 'ArrowRight' && currentPage < totalPages - 1) {
                currentPage++;
                renderFabrics();
            }
        });

        // Initialize
        renderFabrics();

        // Add smooth scroll behavior
        document.documentElement.style.scrollBehavior = 'smooth';
    </script>
</body>
</html>
